# Continuous build + release.
#
# On every push to main (and on manual dispatch) this bumps the version per the
# project rule, commits the bump back, builds the Tauri app and publishes a
# GitHub release with the installer attached. Pushes made with GITHUB_TOKEN do
# not retrigger workflows, so the bump commit cannot cause an infinite loop.

name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Bump version (version.txt + manifests)
        id: bump
        run: node scripts/bump-version.mjs

      - name: Commit version bump
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version.txt package.json src-tauri/tauri.conf.json src-tauri/Cargo.toml
          git commit -m "chore: release v${{ steps.bump.outputs.version }} [skip ci]"
          git push origin HEAD:main

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "MyOpenUKTaxApp v__VERSION__"
          releaseBody: "Automated build of MyOpenUKTaxApp."
          releaseDraft: false
          prerelease: false
