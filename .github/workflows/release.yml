# Continuous build + release for Windows, macOS and Linux.
#
# On every push to main (and on manual dispatch):
#   1. `prepare` bumps the version once per the project rule, commits it back to
#      main, and creates the GitHub release/tag (pushes made with GITHUB_TOKEN do
#      not retrigger workflows, so the bump commit cannot cause a loop).
#   2. `release` builds on all three desktop platforms in parallel, renames each
#      bundle with a windows/macos/linux + arch token, and uploads them to that
#      one release. Windows additionally gets a portable ZIP.

name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Serialise release runs so two pushes cannot bump the version or create the
# same release concurrently; later runs queue rather than race.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Bump version (version.txt + manifests)
        id: bump
        run: node scripts/bump-version.mjs

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version.txt package.json src-tauri/tauri.conf.json src-tauri/Cargo.toml
          git commit -m "chore: release v${{ steps.bump.outputs.version }} [skip ci]"
          git push origin HEAD:main

      # Create the release up front so every matrix job uploads to the same tag.
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.bump.outputs.version }}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "MyOpenUKTaxApp $TAG" \
              --notes "Automated build of MyOpenUKTaxApp for Windows, macOS and Linux." \
              --target main
          fi

  release:
    needs: prepare
    strategy:
      # Build every platform even if one fails, so a single broken target does
      # not deprive the release of the others.
      fail-fast: false
      matrix:
        include:
          # A universal macOS binary (Apple Silicon + Intel), packaged as .app/.dmg.
          - platform: macos-latest
            os_label: macos
            arch: universal
            args: "--target universal-apple-darwin --bundles app,dmg"
          # Linux: the two widely-used, reliably-buildable formats.
          - platform: ubuntu-22.04
            os_label: linux
            arch: amd64
            args: "--bundles deb,appimage"
          # Windows: NSIS installer (setup.exe); a portable ZIP is added below.
          - platform: windows-latest
            os_label: windows
            arch: x64
            args: "--bundles nsis"

    runs-on: ${{ matrix.platform }}
    env:
      TAG: v${{ needs.prepare.outputs.version }}

    steps:
      - name: Checkout (the version-bumped main)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      # Tauri's Linux build needs the WebKitGTK / GTK / AppIndicator dev headers.
      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl wget file libssl-dev

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # macOS needs both arch targets to assemble the universal binary.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      # Build only (no tagName) so tauri-action compiles + bundles and exposes the
      # produced file paths via its `artifactPaths` output without publishing.
      - name: Build the app
        id: tauri
        uses: tauri-apps/tauri-action@v0
        with:
          args: ${{ matrix.args }}

      # Rename each bundle with a platform/arch token and upload to the release.
      - name: Rename and upload platform artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
          OS_LABEL: ${{ matrix.os_label }}
          ARCH: ${{ matrix.arch }}
          TAG: ${{ env.TAG }}
          ARTIFACT_PATHS: ${{ steps.tauri.outputs.artifactPaths }}
        run: node scripts/publish-artifacts.mjs

      # Windows "portable" distribution. Tauri has no native Windows ZIP target,
      # so we zip the compiled standalone executable inside a MyOpenUKTaxApp/
      # folder (it stores all of its data next to itself) and attach it.
      - name: Package and upload Windows portable ZIP
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = "${{ needs.prepare.outputs.version }}"
          $root = "MyOpenUKTaxApp"
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          Copy-Item "src-tauri/target/release/myopenuktaxapp.exe" "$root/MyOpenUKTaxApp.exe"
          $zip = "MyOpenUKTaxApp_${version}_windows_x64_portable.zip"
          Compress-Archive -Path $root -DestinationPath $zip -Force
          gh release upload "$env:TAG" $zip --clobber
